[project]
name = "vlog-pipeline"
version = "0.1.0"
description = "Automated vlog generation from Synology Photos"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "tqdm>=4.60",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-graphql>=1.9",
    "google-genai>=1.0",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.18"]                           # Cross-platform HEIC support
music = ["torch>=2.0", "transformers>=4.30", "scipy>=1.10"]
test = ["pytest>=8.0", "dagster>=1.9"]
all = ["pillow-heif>=0.18", "torch>=2.0", "transformers>=4.30", "scipy>=1.10"]

[project.scripts]
vlog = "run:cli"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring FFmpeg and real media rendering",
]
