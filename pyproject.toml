[project]
name = "vlog-pipeline"
version = "0.1.0"
description = "Automated vlog generation from Synology Photos"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "tqdm>=4.60",
    "google-genai>=1.0",
    "pillow-heif>=0.18",
    "reverse_geocode>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["ruff>=0.8", "pyright>=1.1", "pre-commit>=4.0"]

[project.scripts]
vlog = "cli:cli"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportOptionalMemberAccess = "warning"
exclude = ["tests/"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests requiring FFmpeg and real media rendering (excluded by default, run with -m integration)",
]
