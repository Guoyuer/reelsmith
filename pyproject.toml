[project]
name = "vlog-pipeline"
version = "0.1.0"
description = "Automated vlog generation from Synology Photos"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "tqdm>=4.60",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
]

[project.optional-dependencies]
whisper-mlx = ["mlx-whisper>=0.4"]                    # Apple Silicon only
whisper = ["openai-whisper>=20231117"]                 # Cross-platform (CPU/GPU)
heic = ["pillow-heif>=0.18"]                           # Cross-platform HEIC support
cv = ["opencv-python-headless>=4.8"]                   # Face detection in assemble
music = ["torch>=2.0", "transformers>=4.30", "scipy>=1.10"]
test = ["pytest>=8.0", "dagster>=1.9"]
all = ["openai-whisper>=20231117", "pillow-heif>=0.18", "opencv-python-headless>=4.8", "torch>=2.0", "transformers>=4.30", "scipy>=1.10"]

[project.scripts]
vlog = "run:cli"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring FFmpeg and real media rendering",
]
