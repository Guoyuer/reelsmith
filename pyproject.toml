[project]
name = "vlog-pipeline"
version = "0.1.0"
description = "Automated vlog generation from photos and videos"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yuer Guo"}]
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "pillow-heif>=0.18",
    "reverse_geocode>=1.0",
    "rich>=13.0",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["ruff>=0.8", "pyright>=1.1", "pre-commit>=4.0"]

[project.urls]
Repository = "https://github.com/Guoyuer/vlog"

[project.scripts]
vlog = "pipeline.cli:cli"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportOptionalMemberAccess = "warning"
exclude = ["tests/"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests requiring FFmpeg and real media rendering (excluded by default, run with -m integration)",
]
