[project]
name = "vlog-pipeline"
version = "0.1.0"
description = "Automated vlog generation from Synology Photos"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
whisper = ["mlx-whisper>=0.4"]
test = ["pytest>=8.0"]

[project.scripts]
vlog = "run:cli"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring FFmpeg and real media rendering",
]
